# Week 2 - CI/CD: checkout -> test -> build image -> deploy
#   test   : chạy trên máy GitHub, có PostgreSQL tạm để chạy test tích hợp
#   build  : build Docker image, đẩy lên GitHub Container Registry (ghcr.io)
#   deploy : chạy trên self-hosted runner cài trong VM Ubuntu (VM dùng NAT, không có IP public)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/trvannhan/devops-final-task-manager

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taskdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskapp -d taskdb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://taskapp:ci-only-password@localhost:5432/taskdb_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (unit + PostgreSQL integration)
        run: python -m pytest -v

  build:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Short commit id
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ env.SHORT_SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Ubuntu VM
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/trvannhan/devops-final-task-manager:${{ github.sha }}
      DEPLOY_DIR: /opt/taskmanager
    steps:
      - uses: actions/checkout@v5

      - name: Copy deploy files to /opt/taskmanager
        run: cp docker-compose.yml schema.sql "$DEPLOY_DIR"/

      - name: Write .env from GitHub Secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::Chưa tạo secret POSTGRES_PASSWORD trong GitHub (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nAPP_IMAGE=%s\n' "$POSTGRES_PASSWORD" "$APP_IMAGE" > "$DEPLOY_DIR/.env"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull new image and restart containers
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull app
          docker compose up -d --no-build --remove-orphans
          docker compose ps

      - name: Smoke test through Nginx (:8080)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:8080/health || true)
            if echo "$body" | grep -q "\"version\":\"$expected\""; then
              echo "Deploy OK: $body"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App không trả về version $expected sau 60 giây"
          docker compose logs --tail 50 app
          exit 1

      - name: Clean up
        if: always()
        run: |
          docker logout ghcr.io || true
          docker image prune -f
