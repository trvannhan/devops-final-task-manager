# CI/CD: checkout -> test -> build image -> deploy
#   test   : chạy trên máy GitHub, có PostgreSQL tạm để chạy test tích hợp,
#            kiểm tra cấu hình Docker Compose, Prometheus, luật cảnh báo, Alertmanager
#   build  : build Docker image, đẩy lên GitHub Container Registry (ghcr.io)
#   deploy : chạy trên self-hosted runner cài trong VM Ubuntu (VM dùng NAT, không có IP public)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/trvannhan/devops-final-task-manager

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taskdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskapp -d taskdb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://taskapp:ci-only-password@localhost:5432/taskdb_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (unit + PostgreSQL integration)
        run: python -m pytest -v

      - name: Validate docker-compose.yml
        run: |
          POSTGRES_PASSWORD=x APP_DB_PASSWORD=x GRAFANA_ADMIN_PASSWORD=x docker compose config --quiet
          echo "docker-compose.yml OK"

      - name: Validate monitoring configs and test alert rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules alerts.test.yml
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          python -c "import json; json.load(open('monitoring/grafana/dashboards/taskmanager-overview.json')); print('Grafana dashboard JSON OK')"

  build:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Short commit id
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ env.SHORT_SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Ubuntu VM
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/trvannhan/devops-final-task-manager:${{ github.sha }}
      DEPLOY_DIR: /opt/taskmanager
    steps:
      - uses: actions/checkout@v5

      - name: Copy deploy files to /opt/taskmanager
        run: |
          cp docker-compose.yml schema.sql "$DEPLOY_DIR"/
          rm -rf "$DEPLOY_DIR/monitoring" "$DEPLOY_DIR/scripts"
          cp -r monitoring scripts "$DEPLOY_DIR"/
          chmod +x "$DEPLOY_DIR"/scripts/*.sh
          mkdir -p "$DEPLOY_DIR/backups/metrics"
          chmod 700 "$DEPLOY_DIR/backups"
          chmod 755 "$DEPLOY_DIR/backups/metrics"

      - name: Write .env from GitHub Secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Chưa tạo secret $name trong GitHub (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done
          umask 077
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "APP_DB_PASSWORD=$APP_DB_PASSWORD"
            echo "GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD"
            echo "APP_IMAGE=$APP_IMAGE"
          } > "$DEPLOY_DIR/.env"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull images, apply DB roles, restart containers
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: |
          docker compose pull --quiet
          docker compose up -d --wait db
          docker compose exec -T db psql -U taskapp -d taskdb -q -v ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" < scripts/db-roles.sql
          echo "DB roles OK (app dùng taskapp_rw)"
          docker compose up -d --no-build --remove-orphans
          docker compose ps

      - name: Install daily backup cron (02:00)
        run: |
          line="0 2 * * * $DEPLOY_DIR/scripts/backup.sh >> $DEPLOY_DIR/backups/backup.log 2>&1 # taskmanager-backup"
          ( crontab -l 2>/dev/null | grep -v '# taskmanager-backup' || true; echo "$line" ) | crontab -
          crontab -l | grep taskmanager-backup

      - name: Smoke test through Nginx (:8080)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:8080/health || true)
            if echo "$body" | grep -q "\"version\":\"$expected\""; then
              echo "Deploy OK: $body"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App không trả về version $expected sau 60 giây"
          docker compose logs --tail 50 app
          exit 1

      - name: Check monitoring stack
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/-/ready > /dev/null \
              && curl -fsS http://127.0.0.1:9093/-/ready > /dev/null \
              && curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Prometheus, Alertmanager, Grafana OK"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Hệ thống giám sát chưa sẵn sàng sau 90 giây"
          docker compose ps
          docker compose logs --tail 30 prometheus alertmanager grafana
          exit 1

      - name: Clean up
        if: always()
        run: |
          docker logout ghcr.io || true
          docker image prune -f
