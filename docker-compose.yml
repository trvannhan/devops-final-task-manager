# Week 2: Task Manager chạy bằng Docker Compose
# - db : PostgreSQL 18, dữ liệu nằm trong volume "pgdata" (còn nguyên khi xóa/tạo lại container)
# - app: Flask + Gunicorn, chỉ mở 127.0.0.1:8000 cho Nginx trên VM proxy vào (cổng 8080)
# Biến môi trường lấy từ file .env (không commit), xem .env.example

name: taskmanager

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa được đặt}
    volumes:
      # PostgreSQL 18 lưu dữ liệu tại /var/lib/postgresql/18/docker -> gắn volume vào /var/lib/postgresql
      - pgdata:/var/lib/postgresql
      # Tạo bảng tasks ở lần khởi tạo đầu tiên (khi volume còn trống)
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp -d taskdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/trvannhan/devops-final-task-manager:latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://taskapp:${POSTGRES_PASSWORD}@db:5432/taskdb
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Chỉ lắng nghe trên localhost của VM; bên ngoài truy cập qua Nginx :8080
      - "127.0.0.1:8000:8000"
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
